name: fastplms

x-accelerator: &accelerator
  ipc: host
  init: true
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-common: &common
  <<: *accelerator
  working_dir: /workspace
  environment:
    CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    HF_HOME: /cache/huggingface
    TORCH_HOME: /cache/torch
    XDG_CACHE_HOME: /cache/xdg
    FASTPLMS_ARTIFACTS: /workspace/artifacts
    FASTPLMS_CANDIDATE_ARTIFACTS: /workspace/dist/hub
    FASTPLMS_REFERENCE_RESULTS: /workspace/artifacts/reference/results
  volumes:
    - ..:/workspace
    - hf-cache:/cache/huggingface
    - torch-cache:/cache/torch
    - xdg-cache:/cache/xdg

x-reference: &reference
  <<: *accelerator
  working_dir: /opt/oracle
  environment:
    CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    HF_HOME: /cache/huggingface
    TORCH_HOME: /cache/torch
    XDG_CACHE_HOME: /cache/xdg
  volumes:
    - ../artifacts/reference:/exchange
    - hf-cache:/cache/huggingface
    - torch-cache:/cache/torch
    - xdg-cache:/cache/xdg

services:
  candidate:
    <<: *common
    image: local/fastplms-candidate:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: candidate
    command:
      - python
      - -m
      - pytest
      - tests/unit
      - tests/integration
      - -m
      - not gpu and not slow and not structure

  structure:
    <<: *common
    image: local/fastplms-structure:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: candidate-structure
    command:
      - python
      - -m
      - pytest
      - tests/structure
      - tests/parity/test_boltz_source_refactor.py
      - -m
      - structure

  fp8:
    <<: *common
    image: local/fastplms-fp8:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: candidate-fp8
    command: ["python", "-m", "pytest", "tests/structure", "-m", "structure"]

  benchmark:
    <<: *common
    image: local/fastplms-fp8:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: candidate-fp8
    entrypoint: ["python", "-m", "benchmarks.suite"]

  artifact:
    <<: *common
    image: local/fastplms-artifact:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: candidate-artifact
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TORCH_HOME: /cache/torch
      XDG_CACHE_HOME: /cache/xdg
      FASTPLMS_ARTIFACTS: /workspace/artifacts
      PYTHONPATH: ""
    command:
      - python
      - -m
      - pytest
      - tests/release/test_published_automodel.py
      - -m
      - artifact

  reference-ankh:
    <<: *reference
    image: local/fastplms-reference-ankh:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: reference-ankh
      additional_contexts:
        upstream_ankh: ../vendor/upstream/ankh

  reference-biohub-esm:
    <<: *reference
    image: local/fastplms-reference-biohub-esm:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: reference-biohub-esm
      additional_contexts:
        upstream_biohub_esm: ../vendor/upstream/biohub-esm
        upstream_biohub_transformers: ../vendor/upstream/biohub-transformers

  reference-boltz2:
    <<: *reference
    image: local/fastplms-reference-boltz2:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: reference-boltz2
      additional_contexts:
        upstream_boltz: ../vendor/upstream/boltz

  reference-dplm:
    <<: *reference
    image: local/fastplms-reference-dplm:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: reference-dplm
      additional_contexts:
        upstream_dplm: ../vendor/upstream/dplm

  reference-e1:
    <<: *reference
    image: local/fastplms-reference-e1:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: reference-e1
      additional_contexts:
        upstream_e1: ../vendor/upstream/e1

  reference-esm2:
    <<: *reference
    image: local/fastplms-reference-esm2:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: reference-esm2
      additional_contexts:
        upstream_fair_esm: ../vendor/upstream/fair-esm

  reference-esmfold:
    <<: *reference
    image: local/fastplms-reference-esmfold:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: reference-esmfold
      additional_contexts:
        upstream_fair_esm: ../vendor/upstream/fair-esm
        upstream_openfold: ../vendor/upstream/openfold

  reference-esmfold2:
    <<: *reference
    image: local/fastplms-reference-esmfold2:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: reference-esmfold2
      additional_contexts:
        upstream_biohub_esm: ../vendor/upstream/biohub-esm
        upstream_biohub_transformers: ../vendor/upstream/biohub-transformers

  reference-protein-ttt:
    <<: *reference
    image: local/fastplms-reference-protein-ttt:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: reference-protein-ttt
      additional_contexts:
        upstream_protein_ttt: ../vendor/upstream/protein-ttt

volumes:
  hf-cache:
    name: fastplms-hf-cache
  torch-cache:
    name: fastplms-torch-cache
  xdg-cache:
    name: fastplms-xdg-cache
