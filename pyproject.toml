[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fastplms"
version = "1.0.0"
description = "Minimal Hugging Face-compatible protein language and structure models"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/**"]
authors = [{ name = "Synthyra" }]
keywords = ["bioinformatics", "protein-language-models", "pytorch", "transformers"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "torch>=2.13,<2.14",
  "transformers>=5.13,<5.14",
  "huggingface-hub>=0.34,<2",
  "tokenizers>=0.22,<0.23",
  "safetensors>=0.5,<1",
  "numpy>=1.26,<3",
  "einops>=0.8,<1",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
structure = [
  "accelerate>=1.10,<2",
  "attrs>=25,<27",
  "biopython>=1.85,<2",
  "biotite>=1.4,<2",
  "brotli>=1.1,<2",
  "cloudpathlib>=0.20,<1",
  "httpx>=0.28,<1",
  "msgpack>=1.1,<2",
  "msgpack-numpy>=0.4.8,<1",
  "omegaconf>=2.3,<3",
  "pydssp>=0.9,<1",
  "pygtrie>=2.5,<3",
  "rdkit>=2025.9,<2027",
  "rich>=14,<16",
  "scipy>=1.15,<2",
  "tenacity>=9,<10",
  "trifast>=0.1,<1",
  "typing-extensions>=4.12,<5",
  "zstandard>=0.23,<1",
]
flash = [
  "kernels>=0.15,<0.16",
]
fp8 = [
  "accelerate>=1.10,<2",
  "transformer-engine==2.12.0; platform_system == 'Linux'",
  "transformer-engine-cu13==2.12.0; platform_system == 'Linux'",
  "transformer-engine-torch==2.12.0; platform_system == 'Linux'",
]
train = [
  "accelerate>=1.10,<2",
  "datasets>=4,<5",
  "peft>=0.18,<1",
]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.14,<1",
]

[dependency-groups]
validation = [
  "torch==2.13.0",
  "transformers==5.13.0",
]

[tool.uv]
override-dependencies = [
  "transformer-engine-cu12; sys_platform == 'never'",
]

[tool.kernels.dependencies]
"kernels-community/flash-attn2" = 2
"kernels-community/flash-attn3" = 1

[project.urls]
Homepage = "https://github.com/Synthyra/FastPLMs"
Documentation = "https://github.com/Synthyra/FastPLMs/tree/main/docs"
Issues = "https://github.com/Synthyra/FastPLMs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fastplms"]

[tool.hatch.build.targets.wheel.force-include]
"kernels.lock" = "fastplms-1.0.0.dist-info/kernels.lock"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/pyproject.toml",
  "/README.md",
  "/kernels.lock",
  "/LICENSE",
  "/LICENSES",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "gpu: requires a CUDA accelerator",
  "slow: loads large checkpoints or performs long numerical comparisons",
  "large: requires at least 24 GiB of accelerator memory",
  "structure: exercises protein structure models",
  "compliance: compares against a pinned official upstream implementation",
  "feature: exercises generation, multimodal, TTT, binder, and adapter workflows",
  "artifact: validates a built remote-code artifact in an isolated environment",
  "benchmark: short benchmark-harness smoke test; performance runs live outside pytest",
]
